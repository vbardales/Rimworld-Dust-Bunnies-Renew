:root{--veil:#302A24;--inkPrimary:#F2ECE1;--inkSecondary:#D6B38A;--accent:#FFE119;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}

@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}

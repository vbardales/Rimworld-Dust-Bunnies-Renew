<!doctype html>
<meta charset="utf-8">
<title>Dust Bunnies Renew — showcase</title>
<!--
  Engraves the mod name and its summary line onto the showcase, to the repository
  standard in STYLE_RIMWORLD.md: 896x504, title over the calm upper-left third,
  58x3 amber rule, 21 px summary on 430 px.

  Rendered by Chrome headless at the final size, so the glyphs are never
  resampled. The background is Art/Preview-source.png, the full-resolution
  render, never the reduced Preview.png.

    chrome --headless=new --window-size=896,504 --force-device-scale-factor=1 \
      --screenshot=..\Mod\About\Preview.png _tools\preview.html

  The source is 1536x1024, which is 3:2, so it has to lose 160 rows to reach
  16:9. They are taken off the BOTTOM, hence `top center` rather than `center`:
  the bottom strip is bare plank with nothing on it, while the top band carries
  the hanging lantern, which is the light source the whole picture is built
  around - the lit half is where the creature is, the unlit half is where the
  swept heaps are, and that boundary is the only thing separating two greys.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 896px; height: 504px; position: relative; overflow: hidden; }

  .scene {
    position: absolute; inset: 0;
    background: url('../Art/Preview-source.png') center / cover no-repeat;
  }

  /*
    Darkens the upper-left third so the text reads, and leaves the lantern pool
    alone.

    The upper-left third of this picture is not empty: it holds the workbench
    top and the settler bent over the broom. That is deliberate - they are the
    first half of the sentence the picture tells, and cropping them out would
    leave heaps of dust that nobody swept. So the veil has to work harder here
    than the guide's default: it is held at .90 in the corner and reaches 82%
    rather than 74%, which is what it takes to sink a lit bench top far enough
    for white text to sit over it.

    It stays a circle, unlike Contented Livestock's flattened one. Nothing vivid
    lives in the lower left of this frame - it is bare plank - so there is
    nothing down there to protect from the veil.
  */
  .veil {
    position: absolute; inset: 0;
    background: radial-gradient(circle 800px at top left,
                rgba(6, 5, 4, .91) 0%, rgba(6, 5, 4, 0) 80%);
  }

  .plate {
    position: absolute; left: 50px; top: 44px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .name {
    margin: 0; font-size: 52px; font-weight: 700; line-height: 1;
    color: #FBF7EF; letter-spacing: -1px;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
  }

  .rule {
    width: 58px; height: 3px; margin: 18px 0 0; background: #D68F2C;
  }

  .line {
    margin: 13px 0 0; width: 430px;
    font-size: 21px; line-height: 29px; font-weight: 400;
    color: rgba(251, 247, 239, .88);
    text-shadow: 0 1px 12px rgba(0, 0, 0, .6);
  }
</style>

<div class="scene"></div>
<div class="veil"></div>
<div class="plate">
  <p class="name">Dust Bunnies<br>Renew</p>
  <div class="rule"></div>
  <p class="line">Sweep the floor, pile up the fluff, and the fluff gets up and walks.</p>
</div>
